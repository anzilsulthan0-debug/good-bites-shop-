<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#b8891f" />
  <title>Good Bites — Offline</title>
  <style>
    :root {
      --bg: #fbf8f1;
      --surface: #ffffff;
      --ink: #2b2416;
      --muted: #7d735e;
      --line: #ece3cc;
      --gold: #b8891f;
      --gold-2: #e2bf62;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(60, 44, 10, 0.08);
    }
    img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 22px;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 44px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #ffffff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="/logo.png" alt="Good Bites logo" />
    <h1>You are offline</h1>
    <p>Good Bites could not reach the live server right now. Check your internet connection and tap Retry to sync your shops and receipts.</p>
    <button type="button" onclick="window.location.reload()">Retry Connection</button>
  </main>
</body>
</html>
